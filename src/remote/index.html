<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projector Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Projector">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/remote/remote.css">
</head>
<body class="boot">
  <div id="bg"><span></span><span></span><span></span><div id="grain"></div></div>

  <video id="v" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="camScrim"></div>

  <header id="top">
    <span class="brand"><span id="dot" class="dot"></span><b>Projector</b></span>
    <span class="grow"></span>
    <span id="meter" class="mono"></span>
  </header>
  <div id="status" class="statusPill">Connecting…</div>

  <!-- control (mixer) -->
  <main id="deck" class="panel" hidden></main>
  <!-- queue -->
  <main id="queue" class="panel" hidden></main>

  <div id="msg">
    <div class="msgIcon">◉</div>
    <div id="msgText">Tap to start the camera</div>
    <div id="msgSub" class="sub"></div>
  </div>

  <div id="alignBar" hidden>
    <div class="hint">Drag each handle onto the matching coloured square on the wall. The number inside
      each square is the handle's number.</div>
    <div class="row">
      <button id="bAuto" class="glass">Find markers</button>
      <button id="bAlignCancel" class="glass">Cancel</button>
      <button id="bAlignDone" class="primary">Done</button>
    </div>
  </div>

  <div id="bottom">
    <button id="bCam" class="glass round" title="Switch camera" aria-label="Switch camera">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"/><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button id="bAlign" class="glass">Align</button>
    <button id="bTrack" class="primary grow">Track</button>
    <button id="bMore" class="glass round" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.6 1.7 1.7 0 00-1.9.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.6-1.1 1.7 1.7 0 00-.4-1.9l-.1-.1A2 2 0 117 3.5l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </div>

  <div id="sheet" class="glass" hidden>
    <div class="sheetHead"><b>Settings</b><span class="grow"></span><button id="bSheetClose" class="glass sm">Done</button></div>
    <label>Camera <select id="camSel"></select></label>
    <label>Tracker <select id="modelSel">
      <option value="lite">Lite — fastest</option>
      <option value="full">Full — steadier</option>
      <option value="heavy">Heavy — most accurate</option>
    </select></label>
    <label>People <select id="peopleSel">
      <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
    </select></label>
    <label class="chk"><input type="checkbox" id="skelChk" checked> Show skeleton</label>
    <label class="chk"><input type="checkbox" id="mirrorChk"> Mirror preview</label>
    <label>Name <input type="text" id="nameInp" placeholder="e.g. Tripod left" maxlength="40"></label>
    <div class="hint" id="sheetInfo"></div>
  </div>

  <nav id="viewSeg">
    <button data-view="stage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M8 6l1.2-2h5.6L16 6"/></svg>
      <span>Camera</span>
    </button>
    <button data-view="control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.2" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="2.2" fill="currentColor" stroke="none"/></svg>
      <span>Mixer</span>
    </button>
    <button data-view="queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M19 10v7.2" stroke-linecap="round"/><circle cx="17.3" cy="17.6" r="1.9" fill="currentColor" stroke="none"/><path d="M19 10l2.5-.8V7.2L19 8z" fill="currentColor" stroke="none"/></svg>
      <span>Queue</span>
    </button>
    <div id="navGlow"></div>
  </nav>

  <div id="toast"></div>
  <script type="module" src="/remote/remote.mjs"></script>
</body>
</html>
